site_name: archlux
docs_dir: docs
strict: true

theme:
  name: material
  language: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  # Bilingual site: `page.md` is English (the reference version, ADR 0001), and
  # `page.fr.md` next to it is the French translation. A page without a French file
  # is served in English under /fr/ too, so the language switch never breaks.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Installation: Installation
            Gallery: Galerie
            Repair a plan: Corriger un plan
            Compare two methods: Comparer deux méthodes
            Detect infeasibility: Détecter une infaisabilité
            Read a certificate: Lire un certificat
            Dual diagnostics: Diagnostic dual
            Tutorials: Tutoriels
            Getting started: Premiers pas
            Performance legalization: Légalisation performantielle
            Calibrate a surrogate: Calibrer un substitut
            Train a surrogate: Entraîner un substitut
            Concepts: Concepts
            The two guarantees: Les deux garanties
            The polytope: Le polytope
            The shared oracle: L'oracle partagé
            Why not an image: Pourquoi pas une image
            Conformal prediction: Prédiction conforme
            Formulas: Formules
            Catalogue: Catalogue
            Relative order: Ordre relatif
            Polytope: Polytope
            L1 epigraph: Épigraphe L1
            Area cuts: Coupes de surface
            Exact tiling: Pavage exact
            Farkas and duals: Farkas et duaux
            Exact proof: Preuve exacte
            Pipeline: Pipeline
            Circular statistics: Statistique circulaire
            Analytic surrogate: Substitut analytique
            Split-flux: Split-flux
            Rectilinear (milestone 6): Rectilinéaire (jalon 6)
            Active learning: Apprentissage actif
            BIM export: Export BIM
            Benchmark: Banc d'essai
            Frank-Wolfe: Frank-Wolfe
            Tokens: Jetons
            Gradient validation: Validation du gradient
            Statistics (milestone 5): Statistique (jalon 5)
            Bibliography: Bibliographie
            Reference: Référence
            API: API
            JSON schema: Schéma JSON
            Data: Données
            Corpora: Corpus
            Ground truth: Vérité terrain
            Synthetic: Synthétique
            Milestone reviews: Revues des jalons
            Release 1.0: Publication 1.0
            Limitations: Limites
            Contributing: Contribuer
            Specification: Spécification
  - mkdocstrings:
      handlers: { python: { paths: [src] } }

nav:
  - Home: index.md
  - Installation: installation.md
  - Gallery:
      - Repair a plan: gallery/01-repair-a-plan.md
      - Compare two methods: gallery/02-compare-two-methods.md
      - Detect infeasibility: gallery/03-detect-infeasibility.md
      - Read a certificate: gallery/04-read-a-certificate.md
      - Dual diagnostics: gallery/05-dual-diagnostics.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
      - Performance legalization: tutorials/performance-legalization.md
      - Calibrate a surrogate: tutorials/calibrate-a-surrogate.md
      - Train a surrogate: tutorials/train-a-surrogate.md
  - Concepts:
      - The two guarantees: concepts/two-guarantees.md
      - The polytope: concepts/polytope.md
      - The shared oracle: concepts/shared-oracle.md
      - Why not an image: concepts/why-not-an-image.md
      - Conformal prediction: concepts/conformal-prediction.md
  - Formulas:
      - Catalogue: formulas/index.md
      - Relative order: formulas/relative-order.md
      - Polytope: formulas/separated-polytope.md
      - L1 epigraph: formulas/l1-epigraph.md
      - Area cuts: formulas/area-cuts.md
      - Exact tiling: formulas/tiling.md
      - Farkas and duals: formulas/farkas.md
      - Exact proof: formulas/exact-proof.md
      - Pipeline: formulas/pipeline.md
      - Circular statistics: formulas/circular.md
      - Analytic surrogate: formulas/analytic-surrogate.md
      - Split-flux: formulas/split-flux.md
      - Rectilinear (milestone 6): formulas/rectilinear.md
      - Active learning: formulas/active-learning.md
      - BIM export: formulas/bim-export.md
      - Benchmark: formulas/benchmark.md
      - Frank-Wolfe: formulas/frank-wolfe.md
      - Tokens: formulas/tokens.md
      - Gradient validation: formulas/gradient-validation.md
      - Statistics (milestone 5): formulas/statistics.md
      - Bibliography: formulas/sources.md
  - Reference:
      - API: reference/index.md
      - JSON schema: reference/schema-json.md
  - Data:
      - Corpora: data/index.md
      - Ground truth: data/ground-truth.md
      - Synthetic: data/synthetic.md
      - MSD: data/msd.md
      - Swiss Dwellings: data/swiss-dwellings.md
      - CubiCasa5K: data/cubicasa.md
      - Imputation: data/imputation.md
  - Milestone reviews:
      - Overview: revues/index.md
      - J1 types and JSON: revues/j1.md
      - J2 classic legalization: revues/j2.md
      - J3 performance legalization: revues/j3.md
      - J4 gradient checkpoint: revues/j4.md
      - J5 conformal coverage: revues/j5.md
      - J6 L rooms, active, IFC: revues/j6.md
      - J7 real MSD plans: revues/j7.md
      - J8 generated plans: revues/j8.md
      - J9 orientation: revues/j9.md
  - Release 1.0: release-1.0.md
  - Limitations: limitations.md
  - Contributing: contributing.md
  # Binding documents, published with the site: an architecture rule that cannot be
  # read online ends up read by nobody.
  - Specification:
      - Architecture: specification/ARCHITECTURE.md
      - Glossary (FR -> EN): glossary.md
      - ADR 0001 English-first: adr/0001-english-first.md
      - ADR 0002 Milestone criteria: adr/0002-milestone-criteria-rewritten.md
      - Detailed blueprint: specification/Project_Architecture_Blueprint.md
      - Documentation conventions: specification/DOCUMENTATION.md
      - Milestone 2: specification/MILESTONE-2.md
      - Milestone 3: specification/MILESTONE-3.md
      - Milestone 4: specification/MILESTONE-4.md
      - Milestone 5: specification/MILESTONE-5.md
      - Milestone 6: specification/MILESTONE-6.md
