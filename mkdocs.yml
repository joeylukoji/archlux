site_name: archlux
docs_dir: docs
strict: true

theme:
  name: material
  language: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers: { python: { paths: [src] } }

nav:
  - Home: index.md
  - Installation: installation.md
  - Gallery:
      - Repair a plan: gallery/01-repair-a-plan.md
      - Compare two methods: gallery/02-compare-two-methods.md
      - Detect infeasibility: gallery/03-detect-infeasibility.md
      - Read a certificate: gallery/04-read-a-certificate.md
      - Dual diagnostics: gallery/05-dual-diagnostics.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
      - Performance legalization: tutorials/performance-legalization.md
      - Calibrate a surrogate: tutorials/calibrate-a-surrogate.md
      - Train a surrogate: tutorials/train-a-surrogate.md
  - Concepts:
      - The two guarantees: concepts/two-guarantees.md
      - The polytope: concepts/polytope.md
      - The shared oracle: concepts/shared-oracle.md
      - Why not an image: concepts/why-not-an-image.md
      - Conformal prediction: concepts/conformal-prediction.md
  - Formulas:
      - Catalogue: formulas/index.md
      - Relative order: formulas/relative-order.md
      - Polytope: formulas/separated-polytope.md
      - L1 epigraph: formulas/l1-epigraph.md
      - Area cuts: formulas/area-cuts.md
      - Exact tiling: formulas/tiling.md
      - Farkas and duals: formulas/farkas.md
      - Exact proof: formulas/exact-proof.md
      - Pipeline: formulas/pipeline.md
      - Circular statistics: formulas/circular.md
      - Analytic surrogate: formulas/analytic-surrogate.md
      - Split-flux: formulas/split-flux.md
      - Rectilinear (milestone 6): formulas/rectilinear.md
      - Active learning: formulas/active-learning.md
      - BIM export: formulas/bim-export.md
      - Benchmark: formulas/benchmark.md
      - Frank-Wolfe: formulas/frank-wolfe.md
      - Tokens: formulas/tokens.md
      - Gradient validation: formulas/gradient-validation.md
      - Statistics (milestone 5): formulas/statistics.md
      - Bibliography: formulas/sources.md
  - Reference:
