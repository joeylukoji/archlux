name: Release

# Publishes to PyPI by Trusted Publishing (no token stored in the repository) when a
# version tag is pushed. Configure the trusted publisher once on pypi.org: project
# archlux, owner joeylukoji, repository archlux, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/archlux/_version.py').read_text()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
