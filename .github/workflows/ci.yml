name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Repository hygiene (pre-commit hooks)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Types
        run: mypy src/
      - name: Types (guarantee benchmark)
        run: mypy --strict --explicit-package-bases benchmarks/guarantees/measure.py benchmarks/guarantees/scenarios.py
      - name: Couverture des docstrings
        run: interrogate -f 95 src/archlux
      - name: Doctests (DOCUMENTATION.md §6)
        run: pytest --doctest-modules src/archlux
      - name: Liens morts
        run: mkdocs build --strict

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Regles de dependance (ARCHITECTURE.md §5) -- bloquant
        run: pytest tests/test_dependances.py -q
      - name: Tests
        run: pytest --cov=archlux --cov-report=term-missing

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Budgets de performance (ARCHITECTURE.md §9)
        run: pytest -m budget --benchmark-only
