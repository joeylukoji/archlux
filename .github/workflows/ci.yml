name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Repository hygiene (pre-commit hooks)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Types
        run: mypy src/ examples/
      - name: Types (guarantee benchmark)
        run: mypy --strict --explicit-package-bases benchmarks/guarantees/measure.py benchmarks/guarantees/scenarios.py
      - name: Couverture des docstrings
        run: interrogate -f 95 src/archlux
      - name: Doctests (DOCUMENTATION.md §6)
        run: pytest --doctest-modules src/archlux
      - name: Liens morts
        run: mkdocs build --strict

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Regles de dependance (ARCHITECTURE.md §5) -- bloquant
        run: pytest tests/test_dependencies.py -q
      - name: Tests
        # --cov-branch is redundant: [tool.coverage.run] branch = true in pyproject is authoritative.
        run: pytest --cov=archlux --cov-branch --cov-report=term-missing

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Budgets de performance (ARCHITECTURE.md §9)
        run: pytest -m budget --benchmark-only

  # PLAN.md phase 5, exit gate: the library must work outside Linux. The full suite on
  # Windows and macOS catches platform-dependent output (line endings, paths), as the
  # IFC golden hash once did.
  tests-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  # PLAN.md phase 5, exit gate: `pip install archlux` in a clean environment, then the
  # README example, on Linux, Windows and macOS. The wheel is built and installed in a
  # fresh virtual environment, so nothing is imported from src/.
  install-from-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install it in a clean virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then bin="$RUNNER_TEMP/clean/Scripts"; else bin="$RUNNER_TEMP/clean/bin"; fi
          "$bin/python" -m pip install dist/*.whl
          echo "$bin" >> "$GITHUB_PATH"
      - name: README example, example script and command line
        run: python scripts/smoke_install.py
